<title>Estudo de Marca Iany Detoni</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0E2A1F;--line:#2C5340;--gold:#C9A961;--gold-bright:#E6CB8E;--cream:#EFE9DA;--cream-soft:#B7C0B0;--ink:#0E2A1F;color-scheme:dark}
html,body{background:var(--bg)}
body{min-height:100vh;color:var(--cream);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.top{display:flex;justify-content:flex-end;padding:16px clamp(16px,4vw,32px)}
.top a{display:inline-flex;align-items:center;gap:6px;color:var(--gold-bright);text-decoration:none;font-weight:700;font-size:.78rem;letter-spacing:.03em;padding:8px 16px;border:1px solid var(--gold);border-radius:999px;transition:all .25s ease}
.top a:hover,.top a:focus-visible{background:var(--gold);color:var(--ink);outline:none}
.card{width:100%;max-width:560px;margin:0 auto;text-align:center;padding:0 20px clamp(28px,6vw,56px)}
.hero{position:relative;width:min(64%,250px);margin:clamp(4px,2vw,16px) auto clamp(20px,4vw,30px)}
.hero .emblem{position:absolute;left:50%;top:50%;width:150%;max-width:none;transform:translate(-50%,-50%);mix-blend-mode:screen;opacity:.9;z-index:0;pointer-events:none}
.hero .glow{position:absolute;inset:6% 8%;border-radius:50%;background:radial-gradient(closest-side,rgba(201,169,97,.35),transparent 72%);filter:blur(6px);z-index:0}
.hero .photo{position:relative;z-index:1;display:block;width:100%;height:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-bright)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.1;margin:14px 0 14px}
p{color:var(--cream-soft);font-size:1.02rem;line-height:1.6}
.btns{margin-top:clamp(26px,5vw,38px);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:190px;padding:17px 30px;border-radius:999px;font-weight:800;font-size:1rem;letter-spacing:.02em;text-decoration:none;border:1px solid var(--gold);transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease}
.btn-1{background:transparent;color:var(--gold-bright)}
.btn-1:hover{background:rgba(201,169,97,.14);transform:translateY(-2px)}
.btn-2{background:var(--gold);color:var(--ink);box-shadow:0 10px 30px -12px rgba(201,169,97,.6)}
.btn-2:hover{transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(201,169,97,.75)}
.btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
.logo{width:min(200px,52%);height:auto;display:block;margin:clamp(34px,7vw,52px) auto 0;opacity:.9}
@media (max-width:480px){.btn{width:100%}}
</style>
</head>
