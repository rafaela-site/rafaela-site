<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0E2A1F;--surface:#12331F;--line:#2C5340;--gold:#C9A961;--gold-bright:#E6CB8E;--cream:#EFE9DA;--cream-soft:#B7C0B0;--ink:#0E2A1F;color-scheme:dark}
body{min-height:100vh;background:var(--bg);color:var(--cream);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:clamp(24px,6vw,64px) 20px}
.card{width:100%;max-width:560px;text-align:center}
.logo{width:min(280px,68%);height:auto;margin:0 auto clamp(28px,6vw,44px);display:block}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-bright)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.1;margin:14px 0 14px}
p{color:var(--cream-soft);font-size:1.02rem;line-height:1.6}
.btns{margin-top:clamp(28px,6vw,40px);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:190px;padding:17px 30px;border-radius:999px;
  font-weight:800;font-size:1rem;letter-spacing:.02em;text-decoration:none;border:1px solid var(--gold);transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease}
.btn-1{background:transparent;color:var(--gold-bright)}
.btn-1:hover{background:rgba(201,169,97,.14);transform:translateY(-2px)}
.btn-2{background:var(--gold);color:var(--ink);box-shadow:0 10px 30px -12px rgba(201,169,97,.6)}
.btn-2:hover{transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(201,169,97,.75)}
.btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
.foot{margin-top:clamp(36px,8vw,56px);font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-soft)}
@media (max-width:480px){.btn{width:100%}}
</style>
